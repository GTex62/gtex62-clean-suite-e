---@diagnostic disable: undefined-global
-- widgets/clean-monitor.conky.conf
-- Conky entrypoint for the Monitor chassis (SYS + NET).
-- Pure Cairo rendering — no conky.text, no Conky built-ins. Data comes
-- from the core caches (system, network, connectivity) via
-- lua/suite/monitor_helpers.lua; colors from theme/clean-palettes.lua.
-- Window geometry is driven by theme/clean-layout.lua.

local SUITE_DIR = os.getenv("CONKY_SUITE_DIR")
  or (os.getenv("HOME") .. "/.config/conky/gtex62-clean-suite-e")

local layout = dofile(SUITE_DIR .. "/theme/clean-layout.lua")
local L = layout.monitor

conky.config = {
  -- window placement
  alignment       = L.alignment,
  xinerama_head   = L.xinerama_head,
  gap_x           = L.gap_x,
  gap_y           = L.gap_y,

  -- window style
  own_window              = true,
  own_window_type         = "desktop",
  own_window_hints        = "undecorated,sticky,skip_taskbar,skip_pager,below",
  own_window_argb_visual  = true,
  own_window_argb_value   = 0,
  own_window_transparent  = true,
  background              = false,

  -- geometry
  minimum_width   = L.frame.width,
  maximum_width   = L.frame.width,
  minimum_height  = L.frame.height,

  -- rendering
  double_buffer    = true,
  update_interval  = 1.0,

  -- Lua
  lua_load          = SUITE_DIR .. "/lua/widgets/clean_monitor.lua",
  lua_draw_hook_pre = "draw_monitor",
}

conky.text = [[]]
